name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SECRET_KEY: ci-secret-key
  DATABASE_URL: sqlite+pysqlite:///./ci.db
  ALEMBIC_DATABASE_URL: sqlite+pysqlite:///./ci.db

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff
        run: ruff check .

      - name: Run Black check
        run: black --check .

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: pytest -q

  migrations:
    name: Migrations (PostgreSQL)
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vekro
          POSTGRES_PASSWORD: vekro
          POSTGRES_DB: vekro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vekro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://vekro:vekro@localhost:5432/vekro
      ALEMBIC_DATABASE_URL: postgresql+psycopg://vekro:vekro@localhost:5432/vekro

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # A fresh database must migrate, and a full downgrade must leave it clean enough to migrate again.
      - name: Upgrade, downgrade and upgrade again
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      # Anchor-chain row locks, the append-only triggers and the real order flow on PostgreSQL.
      - name: PostgreSQL-only tests
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://vekro:vekro@localhost:5432/vekro
          SECRET_KEY: ci-secret-key
        run: pytest -q -m postgres

  contracts:
    name: Contracts (Foundry)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Pinned release archive, checksum-verified, with retries: the foundryup installer failed
      # whole jobs on transient GitHub 503/504s (#267).
      - name: Cache Foundry
        id: foundry-cache
        uses: actions/cache@v4
        with:
          path: ~/.foundry/bin
          key: foundry-v1.7.1-cf7e688e

      - name: Install Foundry
        env:
          FOUNDRY_VERSION: v1.7.1
          FOUNDRY_SHA256: cf7e688ed0c4c48adffca788b496076e31060b67ac5afe1e43dbb5499c20c88b
        run: |
          mkdir -p ~/.foundry/bin
          if [ "${{ steps.foundry-cache.outputs.cache-hit }}" != "true" ]; then
            archive="foundry_${FOUNDRY_VERSION}_linux_amd64.tar.gz"
            curl -fsSL --retry 6 --retry-all-errors --retry-delay 10 -o "/tmp/$archive" \
              "https://github.com/foundry-rs/foundry/releases/download/${FOUNDRY_VERSION}/$archive"
            echo "${FOUNDRY_SHA256}  /tmp/$archive" | sha256sum -c -
            tar -xzf "/tmp/$archive" -C ~/.foundry/bin
          fi
          echo "$HOME/.foundry/bin" >> "$GITHUB_PATH"
          ~/.foundry/bin/forge --version

      - name: Format check
        working-directory: contracts
        run: forge fmt --check

      - name: Build and test (unit, fuzz, invariant)
        working-directory: contracts
        run: forge test -vv

      # The backend loads abi/AnchorRegistry.json; it must match the compiled contract.
      - name: Committed ABI matches the build
        working-directory: contracts
        run: |
          jq '.abi' out/AnchorRegistry.sol/AnchorRegistry.json > /tmp/abi.json
          diff -u abi/AnchorRegistry.json /tmp/abi.json

  chain:
    name: Anchoring on Anvil
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Pinned release archive, checksum-verified, with retries: the foundryup installer failed
      # whole jobs on transient GitHub 503/504s (#267).
      - name: Cache Foundry
        id: foundry-cache
        uses: actions/cache@v4
        with:
          path: ~/.foundry/bin
          key: foundry-v1.7.1-cf7e688e

      - name: Install Foundry
        env:
          FOUNDRY_VERSION: v1.7.1
          FOUNDRY_SHA256: cf7e688ed0c4c48adffca788b496076e31060b67ac5afe1e43dbb5499c20c88b
        run: |
          mkdir -p ~/.foundry/bin
          if [ "${{ steps.foundry-cache.outputs.cache-hit }}" != "true" ]; then
            archive="foundry_${FOUNDRY_VERSION}_linux_amd64.tar.gz"
            curl -fsSL --retry 6 --retry-all-errors --retry-delay 10 -o "/tmp/$archive" \
              "https://github.com/foundry-rs/foundry/releases/download/${FOUNDRY_VERSION}/$archive"
            echo "${FOUNDRY_SHA256}  /tmp/$archive" | sha256sum -c -
            tar -xzf "/tmp/$archive" -C ~/.foundry/bin
          fi
          echo "$HOME/.foundry/bin" >> "$GITHUB_PATH"
          ~/.foundry/bin/forge --version

      # The batcher and submitter against the real AnchorRegistry: confirmations, reorgs
      # (evm_snapshot/evm_revert), a crash between record and broadcast, and fee bumps.
      - name: Chain integration tests
        run: pytest -q -m chain

  # M26 (#285): the deployment image builds, its health check answers, and the Compose files and
  # Caddyfile are valid. Nothing is pushed or deployed.
  docker:
    name: Docker image and Compose
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t vekro-api:ci .
      - name: Validate Compose and Caddyfile
        run: |
          cp deploy/env.production.example deploy/.env
          sed -i -e 's/^ACME_EMAIL=.*/ACME_EMAIL=ops@example.com/' \
                 -e 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-only/' deploy/.env
          docker compose -f deploy/compose.yaml --env-file deploy/.env config -q
          docker run --rm -e APP_DOMAIN=app.example.com -e API_DOMAIN=api.example.com \
            -e ACME_EMAIL=ops@example.com -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.8-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Boot in production mode and check /health
        run: |
          docker network create vekro-ci
          docker run -d --name pg --network vekro-ci -e POSTGRES_USER=vekro -e POSTGRES_PASSWORD=ci \
            -e POSTGRES_DB=vekro postgres:16-alpine
          until docker exec pg pg_isready -U vekro -d vekro; do sleep 1; done
          env_args=(
            -e ENVIRONMENT=production -e SECRET_KEY="$(openssl rand -hex 32)"
            -e DATABASE_URL=postgresql://vekro:ci@pg:5432/vekro
            -e ALEMBIC_DATABASE_URL=postgresql://vekro:ci@pg:5432/vekro
            -e FRONTEND_URL=https://app.example.com -e CORS_ORIGINS=https://app.example.com
            -e CORS_ALLOW_CREDENTIALS=true -e SESSION_COOKIE_SECURE=true -e CSRF_COOKIE_SECURE=true
            -e PHONE_CODE_DEV_ECHO=false -e ANCHOR_ADMIN_REF_SECRET="$(openssl rand -hex 32)"
          )
          docker run --rm --network vekro-ci "${env_args[@]}" vekro-api:ci alembic upgrade head
          docker run -d --name api --network vekro-ci "${env_args[@]}" vekro-api:ci
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' api)
            [ "$status" = healthy ] && break
            sleep 3
          done
          docker logs api | tail -20
          [ "$(docker inspect -f '{{.State.Health.Status}}' api)" = healthy ]
