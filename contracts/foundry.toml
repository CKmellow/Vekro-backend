[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10_000
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[fuzz]
runs = 1_000

[invariant]
runs = 256
depth = 64
fail_on_revert = false

[rpc_endpoints]
anvil = "http://127.0.0.1:8545"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
